services:
  geo-content-distribution:
    build: .
    container_name: geo-content-distribution
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
